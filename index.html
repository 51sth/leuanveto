<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103f35"><meta name="description" content="Leuanvetotreenien seuranta"><link rel="manifest" href="manifest.webmanifest">
<title>Leuanveto – Tilastointi</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142822;background:#edf2ef}*{box-sizing:border-box}body{margin:0}header{background:#103f35;color:white;padding:26px 20px 22px}header h1{margin:0;font-size:24px}header small{opacity:.8}main{max-width:650px;margin:auto;padding:18px 15px 100px}.card{background:white;border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 3px 14px #102d2110}h2{font-size:19px;margin:0 0 16px}button,input{font:inherit}button{border:0;cursor:pointer}.primary{background:#087951;color:white;padding:14px;border-radius:12px;font-weight:700;width:100%}.counter{display:flex;align-items:center;justify-content:center;gap:30px;margin:22px 0}.counter strong{font-size:65px;min-width:70px;text-align:center}.circle{width:60px;height:60px;border-radius:50%;font-size:32px;background:#e5f3ec;color:#06754d}.circle.minus{background:#ffeded;color:#bc3434}.muted{color:#61736b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e9efeb}.row:last-child{border:0}.tiny{background:#eef2ef;padding:7px 11px;border-radius:9px}.danger{color:#b23636}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #dbe4df;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;background:white;padding:13px 5px;color:#63766c}.tabs button.active{color:#087951;font-weight:750}section[hidden]{display:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f0f7f3;border-radius:12px;padding:14px}.stat b{display:block;font-size:27px}.chart{display:flex;align-items:end;gap:7px;height:190px;padding:10px 0;border-bottom:1px solid #cdd9d1}.bar{flex:1;min-width:0;background:#15966b;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-23px;left:0;right:0;text-align:center;font-size:10px;color:#61736b}.chartwrap{padding-bottom:30px;overflow-x:auto}select,input[type=number]{width:100%;padding:11px;border:1px solid #c9d9ce;border-radius:10px;background:white;margin-top:6px}input[type=date]{padding:10px;border:1px solid #c9d9ce;border-radius:10px;max-width:100%}.empty{padding:18px 0;color:#718078;text-align:center}.history-day{padding:8px 0 19px;border-bottom:1px solid #e7eee9;margin-bottom:12px}.history-day:last-child{border:0;margin-bottom:0;padding-bottom:0}.history-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.history-total{font-size:13px;background:#e5f3ec;color:#086a4b;border-radius:30px;padding:7px 11px;font-weight:700;white-space:nowrap}.history-set{display:grid;grid-template-columns:27px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f0f3f1}.set-number{color:#7a8b82;font-size:13px}.set-reps{font-weight:700}.set-detail{font-size:13px;color:#63766c;margin-top:2px}.backup-actions{display:grid;gap:10px}.backup-button{display:flex;justify-content:center;align-items:center;width:100%;padding:13px 12px;border-radius:12px;font-weight:700;text-align:center;cursor:pointer}.backup-button.secondary{background:#e7f2ec;color:#096848}.backup-button.outline{background:white;color:#096848;border:1px solid #b7d4c5}.backup-note{font-size:13px;color:#718078;margin:0 0 12px}
</style></head><body>
<header><h1>💪 Leuanveto</h1><small>Oma treenipäiväkirjasi</small></header>
<main>
<section id="train"><div class="card"><h2>Kirjaa sarja</h2><label for="date">Treenipäivä</label> <input id="date" type="date"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px"><label>Ote<select id="grip"><option value="vastaote" selected>Vastaote</option><option value="myötäote">Myötäote</option></select></label><label>Lisäpaino (kg)<input id="weight" type="number" min="0" step="0.5" value="0" inputmode="decimal"></label></div><div class="counter"><button class="circle minus" id="minus" aria-label="Vähennä">−</button><strong id="count">5</strong><button class="circle" id="plus" aria-label="Lisää">+</button></div><button class="primary" id="save">✓ Tallenna sarja</button></div>
<div class="card"><h2>Valitun päivän sarjat</h2><div id="today"></div></div></section>
<section id="stats" hidden><div class="card"><h2>Tilastot</h2><div class="stats" id="numbers"></div></div><div class="card"><h2>Viimeiset 14 päivää</h2><div class="chartwrap"><div class="chart" id="chart"></div></div></div></section>
<section id="history" hidden><div class="card"><h2>Treenihistoria</h2><div id="historyRows"></div></div><div class="card"><h2>Varmuuskopiointi</h2><p class="backup-note">Tallenna treenitiedot tiedostoon tai palauta aiempi varmuuskopio.</p><div class="backup-actions"><button class="backup-button secondary" id="export">↓ Tallenna varmuuskopio</button><label class="backup-button outline" for="import">↑ Palauta varmuuskopio</label></div><input id="import" type="file" accept=".json,application/json" hidden></div></section>
</main><nav class="tabs"><button data-tab="train" class="active">💪<div>Treeni</div></button><button data-tab="stats">▥<div>Tilastot</div></button><button data-tab="history">☷<div>Historia</div></button></nav>
<script>
const KEY="leuanveto-v1";let records=[];try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(a))records=a}catch{}
let count=5;const $=id=>document.getElementById(id);const localDay=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");$("date").value=localDay(new Date());
const saveData=()=>localStorage.setItem(KEY,JSON.stringify(records));const fmt=s=>s.split("-").reverse().join(".");const total=a=>a.reduce((s,r)=>s+r.reps,0);
function render(){ $("count").textContent=count;let d=$("date").value;let todays=records.filter(r=>r.date===d).sort((a,b)=>a.time.localeCompare(b.time));
$("today").innerHTML=todays.length?todays.map((r,i)=>`<div class="row"><span>${i+1}. <b>${r.reps}</b> toistoa <span class="muted">· ${r.grip||"Ote ei kirjattu"} · +${r.weight||0} kg</span> <small class="muted">${r.time.slice(11,16)}</small></span><button class="tiny danger" data-del="${r.id}" aria-label="Poista sarja">Poista</button></div>`).join("")+`<p><b>Yhteensä: ${total(todays)} toistoa</b></p>`:'<div class="empty">Ei vielä sarjoja tältä päivältä</div>';
const days=[...new Set(records.map(r=>r.date))];let best=Math.max(0,...records.map(r=>r.reps));let bestDay=Math.max(0,...days.map(d=>total(records.filter(r=>r.date===d))));
$("numbers").innerHTML=[["Toistoja yhteensä",total(records)],["Treenejä",days.length],["Paras sarja",best],["Eniten päivässä",bestDay]].map(([l,n])=>`<div class="stat"><span>${l}</span><b>${n}</b></div>`).join("");
const all=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);let date=localDay(d);return {date,n:total(records.filter(r=>r.date===date))}});let max=Math.max(1,...all.map(x=>x.n));
$("chart").innerHTML=all.map(x=>`<div class="bar" title="${fmt(x.date)}: ${x.n}" style="height:${Math.max(2,x.n/max*100)}%"><span>${x.date.slice(8)}</span></div>`).join("");
$("historyRows").innerHTML=days.length?days.sort().reverse().map(d=>{let a=records.filter(r=>r.date===d);return `<div class="history-day"><div class="history-head"><b>${fmt(d)}</b><span class="history-total">${total(a)} toistoa</span></div>${a.map((r,i)=>`<div class="history-set"><span class="set-number">${i+1}.</span><div><div class="set-reps">${r.reps} toistoa</div><div class="set-detail">${r.grip||"Ote ei tiedossa"} · ${Number(r.weight)||0} kg lisäpainoa</div></div></div>`).join("")}</div>`}).join(""):'<div class="empty">Ei tallennettuja treenejä</div>';
}
$("plus").onclick=()=>{count++;render()};$("minus").onclick=()=>{count=Math.max(1,count-1);render()};$("date").onchange=render;
$("save").onclick=()=>{if(!$("date").value)return alert("Valitse päivämäärä");records.push({grip:$("grip").value,weight:Math.max(0,Number($("weight").value)||0),id:crypto.randomUUID?.()||String(Date.now())+Math.random(),date:$("date").value,reps:count,time:new Date().toISOString()});saveData();render()};
$("today").onclick=e=>{let id=e.target.dataset.del;if(id&&confirm("Poistetaanko sarja?")){records=records.filter(r=>r.id!==id);saveData();render()}};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==b.dataset.tab);document.querySelectorAll("[data-tab]").forEach(t=>t.classList.toggle("active",t===b));render()});
$("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:"application/json"}));a.download="leuanveto-varmuuskopio.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("import").onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(r=>typeof r.id==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isInteger(r.reps)&&r.reps>0&&typeof r.time==="string"))throw Error();if(confirm("Korvataanko nykyiset tiedot varmuuskopiolla?")){records=a;saveData();render()}}catch{alert("Varmuuskopion tiedosto ei kelpaa")}e.target.value=""};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></body></html>
